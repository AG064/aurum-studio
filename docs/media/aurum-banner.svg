<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
  <title id="title">Aurum Studio</title>
  <desc id="desc">Build games with people and agents. Local workspace, headless automation, playable results.</desc>
  <defs>
