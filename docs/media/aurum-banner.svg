    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f5dfa7"/><stop offset="1" stop-color="#b79755"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#44624e" stop-opacity=".22"/><stop offset="1" stop-color="#101821" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c5b585" stroke-opacity=".055"/></pattern>
  </defs>
