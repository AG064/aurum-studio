name: ci

on:
  push:
    branches: [main, master, 'codex/aurum-web-workbench']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          export TMPDIR="$RUNNER_TEMP/aurum-tests"
          export TMP="$TMPDIR" TEMP="$TMPDIR"
          mkdir -p "$TMPDIR"
          cargo test --workspace --all-features --locked 2>&1 | tee cargo-test.log
      - name: Stress process lifecycle without retrying failures
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/aurum-tests"
          mkdir -p "$TMPDIR"
          for iteration in $(seq 1 100); do
            echo "Lifecycle iteration $iteration / 100" | tee -a lifecycle-stress.log
            cargo test -p aurum-studio-core --locked gameplay::tests -- --nocapture --test-threads=8 2>&1 | tee -a lifecycle-stress.log
          done
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            cargo-test.log
            lifecycle-stress.log
            ${{ runner.temp }}/aurum-tests/**/*.log
          retention-days: 14

  runtime-windows:
    name: Godot project and packaged-game acceptance
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision checksum-pinned runtime
        shell: pwsh
        run: |
          ./scripts/provision-godot.ps1 -Destination "$env:RUNNER_TEMP/godot" -Mode Runtime
          "AURUM_GODOT=$env:RUNNER_TEMP/godot/Godot_v4.7-stable_win64.exe" >> $env:GITHUB_ENV
      - name: Build test tools
        run: cargo build -p aurum-cli -p aurum-editor --locked
      - name: Exercise actual project, editor and game workflows
        shell: pwsh
        run: |
          $env:TEMP="$env:RUNNER_TEMP/aurum-runtime-tests"
          $env:TMP=$env:TEMP
          New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
          ./scripts/tests/studio_project_acceptance.ps1 -AurumBinary ./target/debug/aurum.exe -GodotBinary $env:AURUM_GODOT -Package
          if($LASTEXITCODE){throw 'Project acceptance failed'}
          ./scripts/tests/studio_editor_acceptance.ps1 -EditorDll ./target/debug/aurum_editor.dll -GodotBinary $env:AURUM_GODOT
          if($LASTEXITCODE){throw 'Editor acceptance failed'}
          ./scripts/tests/runtime_bridge_acceptance.ps1 -GodotBinary $env:AURUM_GODOT
          if($LASTEXITCODE){throw 'Runtime checkpoint acceptance failed'}
          ./examples/orbit-break/tools/verify.ps1 -AurumBinary ./target/debug/aurum.exe -GodotBinary $env:AURUM_GODOT -Package
          if($LASTEXITCODE){throw 'Game acceptance failed'}
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-runtime-evidence
          path: |
            ${{ runner.temp }}/aurum-runtime-tests/**/*.log
            ${{ runner.temp }}/aurum-runtime-tests/**/evidence.json
            ${{ runner.temp }}/aurum-runtime-tests/**/verification.json
          retention-days: 14

  lint:
    name: cargo fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  browser-windows:
    name: Browser gameplay, live editing and isolation
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Provision verified runtime and WebAssembly templates
        shell: pwsh
        run: |
          ./scripts/provision-godot.ps1 -Destination "$env:RUNNER_TEMP/godot" -Mode All
          "AURUM_GODOT=$env:RUNNER_TEMP/godot/Godot_v4.7-stable_win64.exe" >> $env:GITHUB_ENV
          "AURUM_WEB_TEMPLATE=$env:RUNNER_TEMP/godot/templates/4.7.stable/web_nothreads_release.zip" >> $env:GITHUB_ENV
          "AURUM_BINARY=$env:GITHUB_WORKSPACE/target/debug/aurum.exe" >> $env:GITHUB_ENV
      - name: Build Studio
        run: cargo build -p aurum-cli --locked
      - name: Provision isolated Rust Web toolchain
        shell: pwsh
        run: |
          ./scripts/provision-web-toolchain.ps1 -Destination "$env:RUNNER_TEMP/web-toolchain"
          "AURUM_EMSDK=$env:RUNNER_TEMP/web-toolchain/emsdk" >> $env:GITHUB_ENV
          "AURUM_WEB_EXTENSION_TEMPLATE=$env:RUNNER_TEMP/godot/templates/4.7.stable/web_dlink_nothreads_release.zip" >> $env:GITHUB_ENV
      - name: Install pinned browser test dependencies
        working-directory: scripts/browser
        run: |
          npm ci
          npx playwright install chromium
      - name: Play and edit a disposable project
        working-directory: scripts/browser
        run: npm test
      - name: Retain screenshots, traces and verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            scripts/browser/test-results
            scripts/browser/playwright-report
          retention-days: 14

  build:
    name: cargo build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p aurum-cli -p aurum-godot -p aurum-editor --locked
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurum-${{ matrix.os }}
          path: |
            target/release/aurum
            target/release/aurum.exe
            target/release/aurum_godot.dll
            target/release/libaurum_godot.so
            target/release/libaurum_godot.dylib
            target/release/aurum_editor.dll
            target/release/libaurum_editor.so
            target/release/libaurum_editor.dylib
          if-no-files-found: error
