[workspace]
resolver = "2"
members = [
    "crates/aurum-core",
    "crates/aurum-godot",
    "crates/aurum-2d",
    "crates/aurum-3d",
    "crates/aurum-space",
    "crates/aurum-vn",
    "crates/aurum-vr",
    "crates/aurum-text",
    "crates/aurum-cli",
    "crates/aurum-mcp",
    "crates/aurum-content",
    "crates/aurum-editor",
    "crates/aurum-studio-core",
    "crates/aurum-studio-server",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Aleks"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
godot = { git = "https://github.com/godot-rust/gdext", branch = "master", features = ["api-4-7"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# File fingerprints and runtime identity hash large binaries. Keep debug symbols
# and assertions, but do not run these CPU-heavy checks without optimization.
[profile.dev.package.aurum-studio-core]
opt-level = 2
